<title>Reformula App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a navegação de telas fica à esquerda (desktop) e o iPhone 14/15 (390x844) no centro. */
:root{
  --navy:#1D3C6E; --navy-deep:#12294F; --teal:#3FCFA2; --teal-deep:#118A66; --teal-soft:#DFF7EE;
  --ink:#0F1E36; --muted:#5B6B85; --line:#E1E8F1; --bg:#F4F7FB; --card:#FFFFFF;
  --coral:#D9534A; --coral-soft:#FDECEA; --amber:#B7791F; --amber-soft:#FDF3DD;
  --grad:linear-gradient(135deg,#1D3C6E 0%,#2A6E94 58%,#3FCFA2 100%);
  --stage:#E9EEF5; --bezel:#0B1220;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding-block:16px;padding-inline:16px}
.rail{width:250px;display:none;flex-direction:column;gap:6px}
.rail h1{font-size:18px;font-weight:800;margin:0 0 2px;color:var(--navy-deep)}
.rail p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;font-weight:700}
.rail button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--navy-deep)}
.rail button:hover{background:#fff}
.rail button.on{background:var(--navy);color:#fff}
.rail button:focus-visible{outline:2px solid var(--teal-deep);outline-offset:1px}
@media(min-width:980px){.rail{display:flex}}
.fit{width:414px;flex:none}
.phone{width:414px;height:868px;border:12px solid var(--bezel);border-radius:62px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(15,30,54,.35);transform-origin:top left}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:30}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 36px;font-weight:700;font-size:15px;z-index:20;pointer-events:none;color:var(--ink)}
.sb.light{color:#fff}
.sb svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:30;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}}
.scroll{flex:1;overflow-y:auto;padding:58px 20px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.nopad{padding-top:0}
.tabs{display:flex;height:84px;padding:8px 6px 26px;background:#fff;border-top:1px solid var(--line);flex:none}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
.tab.on{color:var(--navy)}
.tab.on svg{stroke:var(--navy);stroke-width:2.2}
.tab:focus-visible{outline:2px solid var(--teal-deep)}
@media(max-width:480px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .fit{width:100%!important;height:100dvh!important}
  .phone{width:100%;height:100dvh;border:0;border-radius:0;transform:none!important}
  .island,.sb,.homebar{display:none}
  .scroll{padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
  .tabs{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:auto;min-height:66px}
}
/* componentes */
h2.t{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.2;text-wrap:balance}
h3.s{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:4px 0 0}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.link{all:unset;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer}
.link:focus-visible{outline:2px solid var(--teal-deep)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.tap{cursor:pointer;text-align:left;width:100%}
.card.tap:not(.row){display:block}
.card.tap:hover{border-color:#C7D3E4}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h3{margin:6px 0 4px;font-size:20px;font-weight:800;line-height:1.25;text-wrap:balance}
.hero p{margin:0;font-size:13px;opacity:.92;line-height:1.5}
.btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;text-align:center}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-deep)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.light{background:#fff;color:var(--navy-deep);height:44px;font-size:14px}
.btn.sm{height:38px;font-size:13px;padding:0 14px;border-radius:11px}
.btn.dis{opacity:.45;pointer-events:none}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.off{opacity:.5;pointer-events:none}
.chip:focus-visible{outline:2px solid var(--teal-deep);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep)}
.pill.navy{background:#E4EBF7;color:var(--navy)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.bar{height:8px;border-radius:99px;background:#E8EEF6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--teal-deep)}
.bar.low i{background:var(--coral)}.bar.mid i{background:#E0A030}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E4EBF7;color:var(--navy);flex:none}
.ico.g{background:var(--teal-soft);color:var(--teal-deep)}
.ico.c{background:var(--coral-soft);color:var(--coral)}
.ico.a{background:var(--amber-soft);color:var(--amber)}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:14.5px;line-height:1.3}
.meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.avatar.t{background:var(--teal-deep)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.iconbtn{all:unset;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.iconbtn:focus-visible{outline:2px solid var(--teal-deep)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}
label.l{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.in{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea.in{height:90px;padding:12px 14px;resize:none;line-height:1.45}
.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,60,110,.15)}
.seg{display:flex;background:#E8EEF6;border-radius:14px;padding:4px;gap:4px}
.seg button{all:unset;flex:1;text-align:center;height:40px;line-height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,30,54,.12)}
.seg button:focus-visible{outline:2px solid var(--teal-deep)}
.hbar{display:flex;align-items:center;gap:10px;padding:58px 20px 10px;flex:none}
.hbar h2{margin:0;font-size:17px;font-weight:800;flex:1}
.logo{mix-blend-mode:multiply;display:block}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;line-height:1.35;font-weight:500}
.opt .k{width:30px;height:30px;border-radius:9px;background:#EEF2F8;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--navy);background:#F0F4FB}
.opt.sel .k{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--teal-deep);background:var(--teal-soft)}
.opt.ok .k{background:var(--teal-deep);color:#fff}
.opt.bad{border-color:var(--coral);background:var(--coral-soft)}
.opt.bad .k{background:var(--coral);color:#fff}
.opt:focus-visible{outline:3px solid var(--teal)}
.fb{border-radius:16px;padding:14px;margin-top:14px;font-size:13.5px;line-height:1.55}
.fb.ok{background:var(--teal-soft)}.fb.bad{background:var(--coral-soft)}
.fb b{display:block;font-size:15px;margin-bottom:4px}
.ai{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--navy-deep);background:#fff;border-radius:12px;padding:10px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#C9D4E4}
.dots i.on{width:22px;border-radius:4px;background:var(--navy)}
.fab{position:absolute;right:20px;bottom:104px;height:52px;padding:0 18px 0 14px;border-radius:26px;background:var(--navy);color:#fff;border:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 10px 24px -8px rgba(18,41,79,.6);z-index:5}
.fab:focus-visible{outline:3px solid var(--teal)}
.actionbar{position:absolute;left:12px;right:12px;bottom:96px;background:var(--navy-deep);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:5;box-shadow:0 12px 28px -10px rgba(18,41,79,.7)}
.actionbar span{flex:1;font-weight:700;font-size:13.5px}
.actionbar .btn{height:40px;font-size:13px;border-radius:12px;padding:0 14px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid #B9C6DA;display:grid;place-items:center;flex:none;color:#fff;background:#fff}
.check.on{background:var(--navy);border-color:var(--navy)}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.toast{position:absolute;left:20px;right:20px;bottom:104px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-size:13.5px;font-weight:600;z-index:40;display:flex;gap:10px;align-items:center;animation:fade .2s ease}
.ring{width:84px;height:84px;flex:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.gcard{flex:none;width:228px;border-radius:18px;padding:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.mini{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 24px -14px rgba(18,41,79,.35)}
.loader{width:46px;height:46px;border-radius:50%;border:4px solid #DCE5F2;border-top-color:var(--navy);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loader{animation-duration:2.4s}}
.sep{height:1px;background:var(--line);margin:4px 0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-weight:700}
.tl{display:flex;gap:12px}
.tl .time{width:52px;flex:none;font-weight:800;font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums}
</style>

<div class="stage">
  <nav class="rail" id="rail" aria-label="Telas do protótipo"></nav>
  <div class="fit" id="fit">
    <div class="phone" id="phone">
      <div class="island"></div>
      <div class="sb" id="sb"><span>9:41</span>
        <svg width="66" height="14" viewBox="0 0 66 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M28 3.5c3-2.8 7-2.8 10 0l-1.4 1.5c-2.2-1.9-5.2-1.9-7.2 0zM30.5 7c1.6-1.4 3.4-1.4 5 0L33 10z"/><rect x="45" y="1.5" width="19" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="47" y="3.5" width="15" height="7" rx="1.8"/></svg>
      </div>
      <div id="app"></div>
      <div class="homebar"></div>
    </div>
  </div>
</div>

/* gráfico de linha simples, escala única */
function chartLine(v,w,h){
 const pad={l:26,r:10,t:10,b:22}, min=5, max=7.5, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
 const x=i=>pad.l+iw*i/(v.length-1), y=n=>pad.t+ih*(1-(n-min)/(max-min));
 const pts=v.map((n,i)=>[x(i),y(n)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const area=line+` L${x(v.length-1)} ${pad.t+ih} L${x(0)} ${pad.t+ih} Z`;
 const ticks=[5,6,7].map(t=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="#E1E8F1"/><text x="${pad.l-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="#5B6B85" font-family="Plus Jakarta Sans">${t}</text>`).join('');
 const xl=v.map((_,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="10" fill="#5B6B85" font-family="Plus Jakarta Sans">S${i+1}</text>`).join('');
 const last=pts[pts.length-1];
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Média da turma subiu de 5,4 para 6,8 em seis semanas"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2A6E94" stop-opacity=".22"/><stop offset="1" stop-color="#2A6E94" stop-opacity="0"/></linearGradient></defs>${ticks}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#1D3C6E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xl}<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#1D3C6E" stroke="#fff" stroke-width="2"/><text x="${last[0]-6}" y="${last[1]-10}" text-anchor="end" font-size="11" font-weight="700" fill="#12294F" font-family="Plus Jakarta Sans">6,8</text></svg>`;
}

/* ---------- navegação e render ---------- */
const PROTO=[
 ['Entrada',[['Onboarding','onb'],['Login e perfil','login'],['Configurar perfil (aluno)','setup']]],
 ['Aluno',[['Início e trilha com IA','a_home','aluno'],['Banco de questões','a_q','aluno'],['Resolver questão','a_solve','aluno'],['Resultado','a_result','aluno'],['Revisão inteligente','a_review','aluno'],['Turmas especiais','a_groups','aluno'],['Perfil','a_profile','aluno']]],
 ['Professor',[['Início e plano de aula','t_home','prof'],['Plano de aula inteligente','t_plan','prof'],['Turmas','t_classes','prof'],['Detalhe da turma','t_class','prof'],['Banco e impressão','t_bank','prof'],['Nova questão','t_new','prof'],['Relatórios','t_reports','prof']]]
];
function renderRail(){
 $r=document.getElementById('rail');
 $r.innerHTML=`<h1>Reformula</h1><p>Protótipo clicável. Use o telefone ou pule direto para uma tela.</p>`+PROTO.map(([g,items])=>`<h2>${g}</h2>`+items.map(([n,id,role])=>`<button data-act="jump" data-to="${id}" data-role="${role||''}" class="${S.screen===id?'on':''}">${n}</button>`).join('')).join('');
}
function render(){
 const app=document.getElementById('app');
 const r=SC[S.screen]();
 const tabs=S.role==='prof'?PROF_TABS:ALUNO_TABS;
 const light=false;
 document.getElementById('sb').className='sb';
 app.innerHTML=`<div class="screen" key="${S.screen}">${r.html}${r.tabs?`<nav class="tabs" aria-label="Navegação principal">${tabs.map(([id,i,l])=>`<button class="tab ${S.screen===id?'on':''}" data-act="tab" data-to="${id}" aria-current="${S.screen===id}">${ic(i,24)}<span>${l}</span></button>`).join('')}</nav>`:''}${S.toast?`<div class="toast" role="status">${ic('check',18)}<span>${S.toast}</span></div>`:''}</div>`;
 renderRail();
 const sc=app.querySelector('.scroll'); if(sc&&S._keep){sc.scrollTop=S._keep;S._keep=0}
}
let tt;
function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},2400)}
function go(to){S.stack.push(S.screen);S.screen=to;S.toast='';render()}
function tab(to){S.stack=[];S.screen=to;S.toast='';render()}
function back(){S.screen=S.stack.pop()||(S.role==='prof'?'t_home':'a_home');S.toast='';render()}
function startSet(k){S.set=k;S.q=0;S.pick=null;S.checked=false;S.score=0;S.wrong=[];go('a_solve')}
function keep(){const s=document.querySelector('.scroll');S._keep=s?s.scrollTop:0}

const ACT={
 go:e=>go(e.dataset.to), tab:e=>tab(e.dataset.to), back:()=>back(),
 onb:()=>{if(S.onb<2){S.onb++;render()}else{go('login')}},
 role:e=>{S.role=e.dataset.v;render()},
 login:()=>{if(S.role==='prof'){S.role='prof';S.stack=[];S.screen='t_home';render()}else{S.role='aluno';go('setup')}},
 serie:e=>{S.serie=e.dataset.v;keep();render()}, obj:e=>{S.obj=e.dataset.v;keep();render()},
 mat:e=>{const v=e.dataset.v;S.mats=S.mats.includes(v)?S.mats.filter(x=>x!==v):[...S.mats,v];keep();render()},
 finishSetup:()=>{S.loading=true;render();setTimeout(()=>{S.loading=false;S.stack=[];S.screen='a_home';render()},1500)},
 startSet:e=>startSet(e.dataset.v),
 pick:e=>{if(!S.checked){S.pick=+e.dataset.v;render()}},
 check:()=>{const q=QS[S.set].qs[S.q];S.checked=true;if(S.pick===q.a)S.score++;else S.wrong.push(q.sk);render()},
 next:()=>{if(S.q+1<QS[S.set].qs.length){S.q++;S.pick=null;S.checked=false;render()}else{S.stack.pop();S.screen='a_result';render()}},
 bf:e=>{S.bf=e.dataset.v;render()}, gf:e=>{S.gf=e.dataset.v;render()},
 join:e=>{const id=e.dataset.v;S.joined[id]=!S.joined[id];keep();render();toast(S.joined[id]?'Você entrou na turma.':'Você saiu da turma.')},
 tseg:e=>{S.tseg=e.dataset.v;render()}, openClass:e=>{S.tcls=+e.dataset.v;go('t_class')},
 sel:e=>{const i=+e.dataset.v;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);keep();render()},
 dif:e=>{S.dif=e.dataset.v;keep();render()}, rcls:e=>{S.rcls=+e.dataset.v;render()},
 saveQ:()=>{S.stack.pop();S.screen='t_bank';render();toast('Questão salva no seu banco.')},
 planDone:()=>{S.stack.pop();S.screen='t_home';render();toast('Plano aplicado e reforço enviado a 11 alunos.')},
 toast:e=>toast(e.dataset.v),
 logout:()=>{S.role=null;S.stack=[];S.screen='login';render()},
 jump:e=>{const r=e.dataset.role;if(r)S.role=r;if(e.dataset.to==='onb')S.onb=0;if(e.dataset.to==='a_solve')startSet('mat');else if(e.dataset.to==='a_result'){S.set='mat';S.score=3;S.wrong=['Razão e proporção'];S.stack=[];S.screen='a_result';render()}else{S.stack=[];if(e.dataset.to==='t_class')S.tcls=0;S.screen=e.dataset.to;render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
function fit(){
 const f=document.getElementById('fit'),p=document.getElementById('phone');
 if(innerWidth<=480){f.style.height='';p.style.transform='';return}
 const s=Math.min(1,(innerHeight-32)/868);
 p.style.transform=`scale(${s})`;f.style.height=(868*s)+'px';f.style.width=(414*s)+'px';
}
addEventListener('resize',fit);
fit();render();
</script>
